<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Grammar Quest</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');

*{ box-sizing:border-box; margin:0; padding:0; }
:root{
    --bg:#f8f7fb; --card:#ffffff; --text:#363443; --muted:#858294;
    --pink:#e8cbd9; --pink-dark:#c89db5; --blue:#cbddea; --blue-dark:#91aec5;
    --green:#cfe3d7; --green-dark:#91b9a0; --yellow:#f1e5bd; --purple:#ddd2ea;
    --border:#ece9f0; --shadow:0 10px 35px rgba(70,60,90,.07);
}
body{ font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
button,input{ font-family:inherit; }
button{ cursor:pointer; }
.hidden{ display:none!important; }

/* AUTH */
#authPage{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background: radial-gradient(circle at 15% 15%,#f0dce7 0,transparent 30%), radial-gradient(circle at 85% 85%,#dce9f2 0,transparent 30%), var(--bg); }
.auth-card{ width:100%; max-width:430px; background:white; border:1px solid var(--border); border-radius:30px; padding:40px 32px; box-shadow:var(--shadow); }
.logo{ text-align:center; margin-bottom:28px; }
.logo-icon{ width:70px; height:70px; border-radius:22px; margin:auto; display:flex; align-items:center; justify-content:center; font-size:32px; background:linear-gradient(135deg,var(--pink),var(--purple)); }
.logo h1{ margin-top:15px; font-size:28px; }
.logo p{ color:var(--muted); margin-top:5px; }
.tabs{ display:flex; background:#f6f4f8; padding:5px; border-radius:14px; margin-bottom:22px; }
.tabs button{ width:50%; border:0; background:transparent; padding:11px; border-radius:10px; color:var(--muted); font-weight:700; }
.tabs button.active{ background:white; color:var(--text); box-shadow:0 3px 10px rgba(0,0,0,.05); }
.field{ margin-bottom:15px; }
.field label{ display:block; font-size:13px; font-weight:700; margin-bottom:7px; }
.field input{ width:100%; padding:13px 15px; border:1px solid var(--border); border-radius:13px; outline:none; transition:.2s; }
.field input:focus{ border-color:var(--pink-dark); }
.primary{ width:100%; border:0; padding:14px; border-radius:14px; background:var(--text); color:white; font-weight:800; margin-top:5px; }
.error{ color:#b86d7f; font-size:13px; margin:10px 0; text-align:center; }

/* APP */
#app{ display:none; }
.sidebar{ position:fixed; left:0; top:0; bottom:0; width:245px; background:white; border-right:1px solid var(--border); padding:25px 16px; z-index:20; }
.side-logo{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; padding:5px 10px 25px; }
.side-logo span{ width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center; background:var(--pink); }
.nav{ display:flex; flex-direction:column; gap:5px; }
.nav button{ border:0; background:transparent; text-align:left; padding:13px 14px; border-radius:13px; color:var(--muted); font-weight:700; }
.nav button:hover, .nav button.active{ background:#f6f2f6; color:var(--text); }
.logout{ position:absolute; bottom:25px; left:16px; right:16px; border:1px solid var(--border); background:white; padding:11px; border-radius:12px; color:var(--muted); }
.main{ margin-left:245px; padding:30px; max-width:1400px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
.greeting h2{ font-size:27px; }
.greeting p{ color:var(--muted); margin-top:4px; }
.profile-mini{ display:flex; align-items:center; gap:12px; }
.avatar{ width:45px; height:45px; border-radius:15px; display:flex; align-items:center; justify-content:center; background:var(--purple); font-weight:800; }

/* CARDS */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:25px; }
.stat{ background:white; border:1px solid var(--border); border-radius:20px; padding:20px; box-shadow:var(--shadow); }
.stat-icon{ font-size:23px; }
.stat-value{ font-size:26px; font-weight:800; margin-top:8px; }
.stat-name{ color:var(--muted); font-size:13px; }
.section-title{ display:flex; justify-content:space-between; align-items:center; margin:28px 0 15px; }
.section-title h3{ font-size:20px; }

/* DASHBOARD */
.hero{ background:linear-gradient(120deg,#eee1e8,#e2eaf1); border-radius:25px; padding:28px; display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
.hero-text{ max-width:650px; }
.hero h2{ font-size:25px; margin-bottom:8px; }
.hero p{ color:#6e6a77; line-height:1.6; }
.hero button{ border:0; padding:13px 20px; border-radius:13px; background:white; font-weight:800; }
.progress-box{ margin-top:18px; }
.progress{ height:9px; background:rgba(255,255,255,.65); border-radius:20px; overflow:hidden; }
.progress-fill{ height:100%; width:0%; background:var(--pink-dark); border-radius:20px; transition:.5s; }

/* COURSES */
.course-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:17px; }
.course{ background:white; border:1px solid var(--border); border-radius:21px; padding:21px; box-shadow:var(--shadow); }
.course-icon{ width:47px; height:47px; display:flex; align-items:center; justify-content:center; border-radius:15px; font-size:22px; margin-bottom:15px; }
.course:nth-child(1) .course-icon{background:var(--pink)}
.course:nth-child(2) .course-icon{background:var(--blue)}
.course:nth-child(3) .course-icon{background:var(--green)}
.course:nth-child(4) .course-icon{background:var(--yellow)}
.course:nth-child(5) .course-icon{background:var(--purple)}
.course:nth-child(6) .course-icon{background:#e7ddd3}
.course h4{ font-size:17px; }
.course p{ color:var(--muted); font-size:13px; line-height:1.5; margin:6px 0 15px; }
.course button{ border:0; background:#f5f2f6; padding:10px 14px; border-radius:11px; font-weight:700; }

/* LESSONS */
.lesson-list{ display:grid; gap:12px; }
.lesson{ background:white; border:1px solid var(--border); padding:18px 20px; border-radius:18px; display:flex; align-items:center; justify-content:space-between; }
.lesson-left{ display:flex; align-items:center; gap:15px; }
.lesson-number{ width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center; background:#f3edf2; font-weight:800; }
.lesson h4{ font-size:15px; }
.lesson p{ color:var(--muted); font-size:12px; margin-top:3px; }
.lesson button{ border:0; background:var(--text); color:white; padding:9px 14px; border-radius:10px; font-weight:700; }

/* THEORY CARD */
.theory-card{ max-width:760px; margin:auto; background:white; border:1px solid var(--border); border-radius:25px; padding:32px; box-shadow:var(--shadow); line-height:1.6; }
.theory-card h2{ margin-bottom:15px; font-size:24px; }
.theory-card p{ margin-bottom:12px; color:#504c5c; }
.theory-box{ background:#f7f4f8; border-left:4px solid var(--pink-dark); padding:15px; border-radius:0 13px 13px 0; margin:18px 0; font-size:15px; }

/* QUIZ */
.quiz-card{ max-width:760px; margin:auto; background:white; border:1px solid var(--border); border-radius:25px; padding:28px; box-shadow:var(--shadow); }
.quiz-head{ display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:25px; }
.question{ font-size:21px; line-height:1.45; font-weight:800; margin-bottom:22px; }
.answers{ display:grid; gap:10px; }
.answer{ border:1px solid var(--border); background:#fbfafc; padding:14px; border-radius:13px; text-align:left; font-size:14px; }
.answer:hover{ border-color:var(--pink-dark); }
.answer.correct{ background:#e5f1e9; border-color:#a8c9b4; }
.answer.wrong{ background:#f5e4e8; border-color:#d9a9b5; opacity:0.6; pointer-events:none; }
.explanation{ margin-top:15px; padding:16px; border-radius:13px; background:#fcf4f6; color:#7d4a57; line-height:1.5; font-size:14px; border:1px solid #f1d1d8; }
.next-btn{ width:100%; margin-top:18px; padding:13px; border:0; border-radius:13px; background:var(--text); color:white; font-weight:800; }

/* ANALYTICS */
.chart-card{ background:white; border:1px solid var(--border); border-radius:22px; padding:25px; }
.chart-row{ margin:18px 0; }
.chart-label{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
.bar{ height:13px; background:#f0eef2; border-radius:20px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:20px; }
.before{ background:#d8b8c6; }
.after{ background:#9db9ca; }

/* PROFILE */
.profile-card{ background:white; border:1px solid var(--border); border-radius:24px; padding:28px; max-width:700px; }
.big-avatar{ width:80px; height:80px; background:var(--purple); border-radius:25px; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; margin-bottom:15px; }
.badges{ display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }
.badge{ background:#f5f2f7; padding:12px 15px; border-radius:14px; font-size:13px; }

/* AI CHAT WIDGET */
#aiChatBtn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--text); color: white; font-size: 28px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; display: flex; align-items: center; justify-content: center; }
#aiChatWindow { position: fixed; bottom: 90px; right: 20px; width: 320px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 1000; overflow: hidden; border: 1px solid var(--border); }
#aiChatHeader { background: var(--text); color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
#aiChatMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.ai-msg { padding: 10px 14px; border-radius: 15px; max-width: 85%; line-height: 1.4; }
.ai-msg.user { background: var(--pink); color: var(--text); align-self: flex-end; border-bottom-right-radius: 3px; }
.ai-msg.model { background: #f4f4f6; color: var(--text); align-self: flex-start; border-bottom-left-radius: 3px; }
#aiChatInputArea { display: flex; padding: 10px; border-top: 1px solid var(--border); background: white; }
#aiChatInput { flex: 1; border: 1px solid var(--border); border-radius: 20px; padding: 10px 15px; outline: none; font-size: 14px; }
#aiChatSend { background: var(--text); color: white; border: none; border-radius: 20px; padding: 0 15px; margin-left: 8px; font-weight: bold; }

/* MOBILE */
.mobile-menu{ display:none; }
@media(max-width:900px){
    .sidebar{ width:210px; }
    .main{ margin-left:210px; }
    .stats{ grid-template-columns:repeat(2,1fr); }
    .course-grid{ grid-template-columns:repeat(2,1fr); }
}
@media(max-width:650px){
    .sidebar{ display:none; }
    .main{ margin-left:0; padding:18px; }
    .mobile-menu{ display:block; border:0; background:white; padding:10px 13px; border-radius:10px; }
    .topbar{ gap:10px; }
    .hero{ flex-direction:column; align-items:flex-start; gap:18px; }
    .stats{ grid-template-columns:1fr 1fr; }
    .course-grid{ grid-template-columns:1fr; }
    #aiChatWindow { width: calc(100% - 40px); right: 20px; height: 60vh; bottom: 90px; }
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authPage">
<div class="auth-card">
<div class="logo">
    <div class="logo-icon">✦</div>
    <h1>AI Grammar Quest</h1>
    <p>Изучай грамматику как игру</p>
</div>
<div class="tabs">
    <button id="loginTab" class="active" onclick="showAuth('login')">Вход</button>
    <button id="registerTab" onclick="showAuth('register')">Регистрация</button>
</div>
<div id="loginForm">
<div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="Введите email"></div>
<div class="field"><label>Пароль</label><input id="loginPassword" type="password" placeholder="Введите пароль"></div>
<div id="loginError" class="error"></div>
<button class="primary" onclick="login()">Войти</button>
</div>
<div id="registerForm" class="hidden">
<div class="field"><label>Имя</label><input id="regName" placeholder="Например, Анель"></div>
<div class="field"><label>Email</label><input id="regEmail" type="email" placeholder="Введите email"></div>
<div class="field"><label>Пароль</label><input id="regPassword" type="password" placeholder="Минимум 6 символов"></div>
<div id="registerError" class="error"></div>
<button class="primary" onclick="register()">Создать аккаунт</button>
</div>
</div>
</div>

<!-- APP -->
<div id="app">
<aside class="sidebar">
<div class="side-logo"><span>✦</span>AI Grammar Quest</div>
<nav class="nav">
<button class="active" onclick="navigate('home',this)">⌂ Главная</button>
<button onclick="navigate('courses',this)">▣ Разделы</button>
<button onclick="navigate('diagnostic',this)">◈ Диагностика</button>
<button onclick="navigate('analytics',this)">◫ Аналитика</button>
<button onclick="navigate('profile',this)">♙ Профиль</button>
</nav>
<button class="logout" onclick="logout()">Выйти из аккаунта</button>
</aside>
<main class="main">
<div class="topbar">
<button class="mobile-menu" onclick="toggleMobile()">☰</button>
<div class="greeting">
<h2 id="greeting">Добро пожаловать!</h2>
<p>Продолжим изучение русского языка?</p>
</div>
<div class="profile-mini">
<div><b id="miniName"></b><div style="font-size:12px;color:var(--muted)">Ученик</div></div>
<div class="avatar" id="miniAvatar">А</div>
</div>
</div>
<div id="content"></div>
</main>
</div>

<!-- AI CHAT WIDGET -->
<button id="aiChatBtn" onclick="toggleChat()">💬</button>
<div id="aiChatWindow">
    <div id="aiChatHeader">
        <span>ИИ-Помощник</span>
        <span onclick="toggleChat()" style="cursor:pointer; font-size:20px;">&times;</span>
    </div>
    <div id="aiChatMessages">
        <div class="ai-msg model">Привет! Я помогу тебе с правилами русского языка. Спроси меня о чем-нибудь!</div>
    </div>
    <div id="aiChatInputArea">
        <input id="aiChatInput" type="text" placeholder="Напиши вопрос..." onkeypress="if(event.key==='Enter') sendAI()">
        <button id="aiChatSend" onclick="sendAI()">➤</button>
    </div>
</div>

<script>
/* =========================
   AI CHAT LOGIC
========================= */
const AI_ENDPOINT = "https://grammar-ai-helper.2thjh56gmp-eb9.workers.dev"; 

let aiHistory = [];

function toggleChat() {
    const w = document.getElementById('aiChatWindow');
    w.style.display = w.style.display === 'flex' ? 'none' : 'flex';
}

function buildSystemPrompt() {
    return "Ты — дружелюбный учитель русского языка. Отвечай кратко, понятно и по делу. Приводи примеры. Не используй сложные термины без объяснений.";
}

async function sendAI() {
    const input = document.getElementById('aiChatInput');
    const text = input.value.trim();
    if (!text) return;

    const messagesContainer = document.getElementById('aiChatMessages');
    messagesContainer.innerHTML += <div class="ai-msg user">${text}</div>;
    input.value = '';
    messagesContainer.scrollTop = messagesContainer.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    messagesContainer.innerHTML += <div class="ai-msg model" id="${loadingId}">Печатает...</div>;
    messagesContainer.scrollTop = messagesContainer.scrollHeight;

    aiHistory.push({ role: "user", content: text });

    try {
        const res = await fetch(AI_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                systemInstruction: { parts: [{ text: buildSystemPrompt() }] },
                contents: aiHistory.slice(-10).map(m => ({
                    role: m.role === "assistant" ? "model" : "user",
                    parts: [{ text: m.content }]
                }))
            })
        });

        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || "Не удалось получить ответ.";
        
        document.getElementById(loadingId).textContent = reply;
        aiHistory.push({ role: "assistant", content: reply });
    } catch (e) {
        document.getElementById(loadingId).textContent = "Ошибка сети. Проверьте подключение к интернету.";
    }
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

/* =========================
   DATABASE / AUTH
========================= */
const STORAGE_USERS="grammarQuestUsers";
const STORAGE_SESSION="grammarQuestSession";

function getUsers(){ return JSON.parse(localStorage.getItem(STORAGE_USERS)||"{}"); }
function saveUsers(users){ localStorage.setItem(STORAGE_USERS,JSON.stringify(users)); }

function showAuth(type){
    document.getElementById("loginForm").classList.toggle("hidden",type!=="login");
    document.getElementById("registerForm").classList.toggle("hidden",type!=="register");
    document.getElementById("loginTab").classList.toggle("active",type==="login");
    document.getElementById("registerTab").classList.toggle("active",type==="register");
}

function register(){
    const name=document.getElementById("regName").value.trim();
    const email=document.getElementById("regEmail").value.trim().toLowerCase();
    const password=document.getElementById("regPassword").value;
    const error=document.getElementById("registerError");

    if(!name || !email || !password){ error.textContent="Заполните все поля."; return; }
    if(password.length<6){ error.textContent="Пароль должен содержать минимум 6 символов."; return; }

    const users=getUsers();
    if(users[email]){ error.textContent="Аккаунт с таким email уже существует."; return; }

    users[email]={ name, email, password, stars:0, streak:0, completed:[], mistakes:{ participle:0, gerund:0, spp:0, punctuation:0, syntax:0, style:0 }, before:null, after:null, created:new Date().toISOString() };
    saveUsers(users);
    localStorage.setItem(STORAGE_SESSION,email);
    openApp();
}

function login(){
    const email=document.getElementById("loginEmail").value.trim().toLowerCase();
    const password=document.getElementById("loginPassword").value;
    const users=getUsers();
    const error=document.getElementById("loginError");

    if(!users[email] || users[email].password!==password){ error.textContent="Неверный email или пароль."; return; }
    localStorage.setItem(STORAGE_SESSION,email);
    openApp();
}

function logout(){
    localStorage.removeItem(STORAGE_SESSION);
    document.getElementById("app").style.display="none";
    document.getElementById("authPage").style.display="flex";
    showAuth("login");
}

function currentUser(){
    const session=localStorage.getItem(STORAGE_SESSION);
    const users=getUsers();
    return session ? users[session] : null;
}

function updateUser(data){
    const session=localStorage.getItem(STORAGE_SESSION);
    const users=getUsers();
    if(!session || !users[session]) return;
    users[session]=data;
    saveUsers(users);
}

/* =========================
   LESSON DATABASE (6 разделов с теорией >= 6 предложений)
========================= */
const sections=[
{id:"participle",icon:"🌸",title:"Причастие",description:"Образование, виды, обороты и пунктуация.",lessons:[
    ["Причастие как часть речи","Определяем значение и грамматические признаки.", "Причастие представляет собой особую форму глагола, которая совмещает в себе признаки глагола и прилагательного. Данная часть речи обозначает признак предмета по его действию и отвечает на вопросы какой? какая? какое? какие? Причастие может быть как действительным, так и страдательным в зависимости от того, сам ли предмет производит действие. В предложениях причастия чаще всего выступают в роли определений, согласовываясь с существительными. Грамматически они изменяются по родам, числам и падежам, полностью подстраиваясь под главное слово. Использование причастий делает письменную речь более точной, образной и богатой."],
    ["Действительные причастия","Учимся образовывать и распознавать формы.", "Действительные причастия обозначают признак предмета, который сам производит или производил действие. Они образуются как в настоящем, так и в прошедшем времени с помощью специальных суффиксов. В настоящем времени используются суффиксы -ущ-, -ющ-, -ащ-, -ящ-, а в прошедшем — суффиксы -вш- и -ш-. Например, от глагола 'лететь' образуется действительное причастие 'летящий', а от 'прочитать' — 'прочитавший'. При этом такие причастия сохраняют вид и возвратность исходного глагола. Умение находить их помогает грамотно строить сложные синтаксические конструкции."],
    ["Страдательные причастия","Разбираемся в способах образования.", "Страдательные причастия обозначают признак того предмета, над которым производится или было произведено действие со стороны другого лица. Они имеют формы настоящего и прошедшего времени, каждая из которых обладает своими суффиксами. В настоящем времени применяются суффиксы -ем-, -ом- и -им-, а в прошедшем — -енн-, -нн- и -т-. Ярким примером служит слово 'написанный', образованное от глагола совершенного вида 'написать'. Страдательные причастия часто используются в книжной и официально-деловой речи. Они позволяют сместить акцент с деятеля на сам объект действия."],
    ["Причастный оборот","Находим зависимые слова.", "Причастный оборот представляет собой причастие вместе со всеми зависящими от него словами. В структуре предложения этот оборот всегда выполняет синтаксическую роль единого распространенного определения. Главное слово, к которому относится оборот, называется определяемым словом. Очень важно правильно находить границы конструкции при анализе текста. От положения определяемого слова напрямую зависит постановка знаков препинания. Развитие этого навыка критически важно для сдачи экзаменов по русскому языку."],
    ["Пунктуация при причастном обороте","Учимся правильно расставлять знаки.", "Правила пунктуации при причастном обороте зависят исключительно от его взаимного расположения с определяемым словом. Если причастный оборот стоит после определяемого слова, то он обязательно выделяется запятыми с обеих сторон. Когда же оборот располагается перед определяемым словом, запятая не ставится. Одиночные причастия обычно не обособляются, если не имеют при себе зависимых слов. Нарушение этого правила считается пунктуационной ошибкой. Внимательный анализ структуры предложения помогает безошибочно расставить все необходимые знаки препинания."],
    ["Причастия в тексте","Используем конструкции в собственных предложениях.", "Активное использование причастий в письменной речи позволяет сделать текст более лаконичным и выразительным. Они помогают избежать громоздких придаточных конструкций со словом 'который'. Уместное употребление причастных оборотов демонстрирует высокий уровень владения языком. При редактировании текстов полезно заменять некоторые глаголы на причастия для плавности слога. Важно следить за тем, чтобы согласование причастий с существительными было безупречным. Практика написания текстов с причастиями улучшает общую грамотность ученика."]
]},
{id:"gerund",icon:"🌿",title:"Деепричастие",description:"Добавочное действие и деепричастные обороты.",lessons:[
    ["Деепричастие как часть речи","Основное и добавочное действие.", "Деепричастие является самостоятельной неизменяемой частью речи, которая обозначает добавочное действие при основном глаголе. Эта форма совмещает в себе признаки глагола и наречия, отвечая на вопросы что делая? что сделав? Основное действие в предложении всегда выражается сказуемым, а добавочное — деепричастием. Оба этих действия обязательно должны выполняться одним и тем же лицом или предметом. Деепричастия не изменяются по падежам и числам, сохраняя за собой глагольный вид. Использование этой формы придает повествованию динамичность и связность."],
    ["Образование деепричастий","Совершенный и несовершенный вид.", "Способы образования деепричастий напрямую зависят от вида исходного глагола. Деепричастия несовершенного вида образуются от основы настоящего времени с помощью суффиксов -а- или -я-. Деепричастия совершенного вида обычно формируются от основы прошедшего времени при помощи суффиксов -в, -вши или -вшись. Например, от глагола 'читать' получается 'читая', а от 'прочитать' — 'прочитав'. Некоторые глаголы из-за особенностей звучания не образуют деепричастий несовершенного вида. Знание этих суффиксов позволяет безошибочно распознавать глагольные формы в тексте."],
    ["Деепричастный оборот","Определяем границы конструкции.", "Деепричастный оборот представляет собой деепричастие вместе с зависимыми от него словами. В русском языке деепричастный оборот всегда выступает в роли обстоятельственного члена предложения. На письме эта конструкция в подавляющем большинстве случаев выделяется запятыми. Нахождение границ оборота помогает правильно понять структуру сложного предложения. Важно не путать деепричастные обороты с причастными или обычными наречиями. Регулярная практика синтаксического разбора облегчает эту задачу."],
    ["Пунктуация с деепричастиями","Когда нужна запятая.", "Правило обособления деепричастий и деепричастных оборотов является одним из самых строгих в пунктуации. Независимо от своего положения в предложении, деепричастный оборот всегда отделяется запятыми. Одиночные деепричастия также обособляются, если сохраняют значение добавочного действия. Исключением являются лишь устойчивые выражения и фразеологизмы, которые превратились в наречия. Примером фразеологизма служит выражение 'работать спустя рукава', где запятая не нужна. Внимательное отношение к структуре текста помогает избегать пунктуационных ошибок."],
    ["Грамматическая связь","Кто выполняет основное действие?", "Главное грамматическое правило употребления деепричастий гласит, что добавочное и основное действие должны совершаться одним субъектом. Нарушение этого правила приводит к грубым речевым ошибкам в предложениях. Например, фраза 'Подъезжая к станции, у меня слетела шляпа' построена неверно. В ней деепричастие приписано к шляпе, хотя подъезжал к станции человек. Правильный вариант должен содержать подлежащее-человека, выполняющего оба действия. Умение находить такие ошибки спасает учеников от потери баллов в тестах."],
    ["Использование в письменной речи","Создаём собственные конструкции.", "Грамотное применение деепричастных конструкций делает письменную речь богатой и выразительной. Они позволяют компактно выразить последовательность или одновременность происходящих событий. Писатели часто используют деепричастия для создания ярких и динамичных пейзажных зарисовок. При создании собственных текстов важно следить за логикой связи всех компонентов предложения. Избыток деепричастий может утяжелить слог, поэтому следует соблюдать меру. Постоянное совершенствование навыков письма помогает писать грамотно и убедительно."]
]},
{id:"spp",icon:"🪻",title:"СПП",description:"Сложноподчинённые предложения и виды придаточных.",lessons:[
    ["Строение СПП","Главная и придаточная части.", "Сложноподчинённое предложение представляет собой конструкцию, состоящую из главного и одного или нескольких придаточных предложений. Главная часть является независимой, в то время как придаточная подчиняется ей грамматически. Связь между ними осуществляется с помощью подчинительных союзов или союзных слов. Придаточная часть может находиться перед главным предложением, после него или внутри него. От места расположения придаточной части зависят особенности пунктуационного оформления. Изучение структуры СПП составляет основу синтаксиса старшей школы."],
    ["Подчинительные союзы","Выбираем подходящий союз.", "Подчинительные союзы служат важнейшим средством связи частей в сложноподчинённом предложении. Они не являются членами предложения, а выполняют чисто грамматическую и смысловую роль. По значению союзы делятся на временные, причинные, условные, уступительные, целевые и другие. Примерами служат союзы 'что', 'чтобы', 'потому что', 'если', 'хотя'. Правильный выбор союза позволяет точно передать логику рассуждения и причинно-следственные связи. Ошибки в выборе союзов искажают смысл высказывания."],
    ["Союзные слова","Который, где, когда, почему и другие.", "Союзные слова в сложноподчинённых предложениях выполняют двойную функцию. Они связывают придаточную часть с главной и одновременно являются самостоятельными членами предложения. К союзным словам относятся относительные местоимения и наречия вроде 'который', 'кто', 'что', 'где', 'куда', 'откуда'. В отличие от союзов, на союзные слова часто падает логическое ударение при чтении. Их можно заменить синонимичными полнозначными словами из главного предложения. Умение отличать союзы от союзных слов является ключевым навыком для сдачи экзаменов."],
    ["Придаточные определительные","Характеристика предмета.", "Придаточные определительные отвечают на вопросы какой? чей? и относятся к существительному в главном предложении. Они всегда присоединяются к определяемому слову с помощью союзных слов 'который', 'какой', 'чей' или наречий 'где', 'куда'. Такие придаточные всегда стоят строго после определяемого слова или внутри него. Например, в предложении 'Книга, которую я читал, оказалась интересной' выделена придаточная часть. Они выполняют ту же роль, что и обычное определение в простом предложении. Понимание этой темы помогает делать тексты более информативными."],
    ["Придаточные изъяснительные","Передача содержания мысли.", "Придаточные изъяснительные дополняют сказуемое или другое слово в главном предложении. Они отвечают на все вопросы косвенных падежей, заменяя собой дополнения. Присоединяются они с помощью союзов 'что', 'чтобы', 'будто' или союзных слов с частицей ли. Примером может служить предложение 'Я знаю, что ты справишься с заданием'. Придаточная часть здесь раскрывает содержание мысли, выраженной в главном предложении. Знание изъяснительных конструкций помогает правильно оформлять косвенную речь. Это делает письменную речь логичной и структурированной."],
    ["Придаточные обстоятельственные","Причина, время, условие, цель.", "Придаточные обстоятельственные подразделяются на множество разрядов по значению. Они делятся на придаточные времени, места, причины, условия, цели, следствия и уступки. Каждая разновидность отвечает на соответствующие вопросы обстоятельств и вводится своими союзами. Например, придаточные причины отвечают на вопрос почему? и вводятся союзами 'потому что', 'так как'. Они позволяют детально описать условия протекания основного действия. Изучение этих конструкций развивает логическое мышление и письменную культуру ученика."],
    ["Схемы СПП","Учимся строить схемы.", "Построение графических схем сложноподчинённых предложений помогает наглядно увидеть их структуру. Главное предложение на схеме принято обозначать квадратными скобками, а придаточное — круглыми. Внутри скобок обязательно отображаются союзы, союзные слова и главные члены предложения. Схемы позволяют безошибочно определить количество частей и границы между ними. Это особенно полезно при расстановке знаков препинания в многосоставных предложениях. Регулярная практика построения схем закрепляет теоретические знания на практике."],
    ["Конструирование СПП","Создаём сложные предложения.", "Конструирование сложноподчинённых предложений развивает творческие и аналитические способности. Превращение простых предложений в сложные обогащает синтаксический строй письменной речи. Важно следить за тем, чтобы союзы подходили по смыслу и не перегружали текст. Умение грамотно комбинировать придаточные части отличает зрелого автора. Такие навыки востребованы при написании эссе, сочинений и деловых писем. Практика конструирования помогает лучше понимать чужие тексты."]
]},
{id:"punctuation",icon:"🫧",title:"Пунктуация",description:"Запятые и другие знаки в сложных конструкциях.",lessons:[
    ["Запятая при причастии","Основные случаи.", "Правила обособления причастных оборотов требуют строгого соблюдения позиционных принципов. Если причастный оборот стоит после определяемого слова, ставится запятая. Если перед определяемым словом — запятая не ставится ни при каких условиях. Одиночные причастия обычно не требуют обособления на письме. Знание этих нюансов предотвращает грубые пунктуационные ошибки в текстах. Систематические упражнения помогают довести этот навык до автоматизма."],
    ["Запятая при деепричастии","Обособление оборота.", "Деепричастный оборот на письме всегда выделяется запятыми независимо от своего расположения. Это правило является одним из самых стабильных в русской пунктуации. Исключением выступают лишь устойчивые выражения и фразеологизмы. Одиночные деепричастия также обособляются, если сохраняют глагольное значение добавочного действия. Важно не забывать ставить запятые при встрече с такими конструкциями. Внимательный анализ текста гарантирует безупречную грамотность."],
    ["Запятая между частями СПП","Границы главной и придаточной частей.", "Между главным и придаточным предложениями в составе СПП всегда ставится запятая. Это правило действует независимо от того, где именно находится придаточная часть. Если придаточное предложение находится внутри главного, оно выделяется запятыми с двух сторон. На стыке двух союзов также могут возникать особые пунктуационные правила. Четкое разграничение частей предложения облегчает процесс чтения и понимания. Правильная расстановка запятых делает текст профессиональным."],
    ["Однородные конструкции","Несколько действий и признаков.", "Однородные члены предложения требуют особого внимания к знакам препинания. Запятая между ними ставится, если они связаны бессоюзной связью или противительными союзами. При наличии одиночных соединительных союзов 'и' запятая не нужна. Однородными могут быть любые члены предложения: подлежащие, сказуемые, дополнения. Важно уметь отличать однородные ряды от неоднородных определений. Это позволяет избежать лишних запятых при письме."],
    ["Сложные случаи","Разбираем исключения.", "В русской пунктуации существует немало сложных случаев и спорных моментов. Они связаны с неоднозначностью некоторых союзов, вводных слов и омонимичных частиц. Для правильной постановки знаков требуется глубокий синтаксический анализ. Разбор таких примеров развивает критическое мышление учеников. Изучение исключений позволяет успешно справляться с олимпиадными заданиями. Практикум по сложным случаям является важнейшей частью обучения."],
    ["Пунктуационный практикум","Исправляем ошибки.", "Пунктуационный практикум закрепляет полученные теоретические знания на реальных текстах. Самостоятельный поиск и исправление чужих ошибок развивают зоркость к деталям. Ученики учатся аргументировать необходимость постановки каждого конкретного знака. Регулярное выполнение таких упражнений повышает общую грамотность. Наличие обратной связи помогает вовремя скорректировать пробелы в знаниях. Итоговый практикум подводит черту под изучением раздела."]
]},
{id:"syntax",icon:"📖",title:"Синтаксис",description:"Связи слов и построение грамотных предложений.",lessons:[
    ["Словосочетание","Главное и зависимое слово.", "Словосочетание представляет собой соединение двух или более самостоятельных слов. Одно из слов в нем является главным, а другое — зависимым. Связь между ними устанавливается по смыслу и с помощью грамматики. В русском языке выделяют три основных вида связи: согласование, управление и примыкание. Словосочетания служат строительным материалом для предложений. Понимание их структуры помогает правильно строить фразы."],
    ["Простое предложение","Грамматическая основа.", "Простое предложение выражает законченную мысль и имеет одну грамматическую основу. Грамматическая основа состоит из подлежащего и сказуемого либо из одного главного члена. Второстепенные члены распространяют основу, добавляя детальную информацию. Простое предложение может быть осложнено однородными или обособленными членами. Анализ структуры предложения является базовым навыком синтаксиса. Он необходим для понимания законов построения текста."],
    ["Односоставные предложения","Основные типы.", "Односоставные предложения имеют только один главный член вместо двух классических. По форме главного члена они делятся на определенно-личные, неопределенно-личные и безличные. В определенно-личных предложениях действие совершается говорящим или собеседником. В безличных предложениях деятель вообще отсутствует по смыслу конструкции. Такие предложения придают речи особую выразительность и лаконичность. Они широко используются как в художественной, так и в разговорной речи."],

/* =========================
   NAVIGATION
========================= */
function openApp(){
    document.getElementById("authPage").style.display="none";
    document.getElementById("app").style.display="block";
    const user=currentUser();
    if(user){
        document.getElementById("greeting").textContent="Привет, "+user.name+"! 👋";
        document.getElementById("miniName").textContent=user.name;
        document.getElementById("miniAvatar").textContent=user.name.charAt(0).toUpperCase();
    }
    renderHome();
}

function navigate(page,button){
    document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
    if(button) button.classList.add("active");
    if(page==="home") renderHome();
    if(page==="courses") renderCourses();
    if(page==="diagnostic") renderDiagnostic();
    if(page==="analytics") renderAnalytics();
    if(page==="profile") renderProfile();
}

function renderHome(){
    const user=currentUser();
    let totalLessons=sections.reduce((sum,s)=>sum+s.lessons.length,0);
    let done=user.completed.length;
    let percent=Math.round(done/totalLessons*100);

    document.getElementById("content").innerHTML=`
    <div class="hero">
        <div class="hero-text">
            <h2>Твой путь к грамотной речи ✨</h2>
            <p>Проходи уроки, выполняй задания, исправляй ошибки и постепенно повышай свой уровень русского языка.</p>
            <div class="progress-box">
                <div style="font-size:12px;margin-bottom:5px">Общий прогресс — ${percent}%</div>
                <div class="progress"><div class="progress-fill" style="width:${percent}%"></div></div>
            </div>
        </div>
        <button onclick="navigate('courses',document.querySelectorAll('.nav button')[1])">Продолжить →</button>
    </div>

    <div class="stats">
        <div class="stat"><div class="stat-icon">⭐</div><div class="stat-value">${user.stars}</div><div class="stat-name">Звёзды</div></div>
        <div class="stat"><div class="stat-icon">🔥</div><div class="stat-value">${user.streak}</div><div class="stat-name">Серия занятий</div></div>
        <div class="stat"><div class="stat-icon">📚</div><div class="stat-value">${done}</div><div class="stat-name">Уроков завершено</div></div>
        <div class="stat"><div class="stat-icon">🏆</div><div class="stat-value">${getLevel(user.stars)}</div><div class="stat-name">Уровень</div></div>
    </div>

    <div class="section-title"><h3>Рекомендуем начать</h3></div>
    <div class="course-grid">
        ${sections.slice(0,3).map((s,i)=>
        <div class="course">
            <div class="course-icon">${s.icon}</div>
            <h4>${s.title}</h4>
            <p>${s.description}</p>
            <button onclick="openSection('${s.id}')">Начать</button>
        </div>
        ).join("")}
    </div>`;
}

function getLevel(stars){
    if(stars>=100) return "Эксперт";
    if(stars>=60) return "Продвинутый";
    if(stars>=30) return "Практик";
    if(stars>=10) return "Ученик";
    return "Новичок";
}

function renderCourses(){
    document.getElementById("content").innerHTML=
    <div class="section-title"><h3>Разделы обучения</h3></div>
    <div class="course-grid">
    ${sections.map(s=>
        <div class="course">
            <div class="course-icon">${s.icon}</div>
            <h4>${s.title}</h4>
            <p>${s.description}</p>
            <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${s.lessons.length} уроков</div>
            <button onclick="openSection('${s.id}')">Открыть раздел →</button>
        </div>
    ).join("")}
    </div>;
}

function openSection(id){
    const section=sections.find(s=>s.id===id);
    document.getElementById("content").innerHTML=
    <div class="section-title">
        <div>
            <h3>${section.icon} ${section.title}</h3>
            <p style="color:var(--muted);font-size:13px;margin-top:4px">${section.description}</p>
        </div>
    </div>
    <div class="lesson-list">
    ${section.lessons.map((l,i)=>
        <div class="lesson">
            <div class="lesson-left">
                <div class="lesson-number">${i+1}</div>
                <div><h4>${l[0]}</h4><p>${l[1]}</p></div>
            </div>
            <button onclick="startTheory('${id}',${i})">${currentUser().completed.includes(id+"-"+i)?"Повторить":"Изучить"}</button>
        </div>
    ).join("")}
    </div>;
}

/* ШАГ 1: ТЕОРИЯ ПЕРЕД УРОКОМ */
function startTheory(sectionId, lessonIndex){
    const section=sections.find(s=>s.id===sectionId);
    const lesson=section.lessons[lessonIndex];

    document.getElementById("content").innerHTML=`
    <div class="theory-card">
        <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">ТЕОРИЯ • ${section.title.toUpperCase()}</div>
        <h2>${lesson[0]}</h2>
        <p style="font-size:15px; margin-bottom:15px; color:var(--muted);">${lesson[1]}</p>
        
        <div class="theory-box">
            <b>Подробный теоретический материал:</b><br><br>
            ${lesson[2]}
        </div>

        <p style="color:var(--muted); font-size:14px; margin:20px 0;">Изучите правила выше, после чего нажмите кнопку для перехода к практическим заданиям.</p>
        
        <button class="next-btn" onclick="startLesson('${sectionId}', ${lessonIndex})">Перейти к тесту →</button>
    </div>`;
}

let quizState={ section:"", lesson:0, questions:[], index:0, score:0, answered:false };

function startLesson(section,index){
    let questions=quizzes[section]||quizzes.punctuation;
    quizState={ section, lesson:index, questions:[...questions].sort(()=>Math.random()-.5).slice(0,5), index:0, score:0, answered:false };
    renderQuestion();
}

function renderQuestion(){
    const state=quizState;
    const q=state.questions[state.index];
    document.getElementById("content").innerHTML=
    <div class="quiz-card">
        <div class="quiz-head">
            <span>${state.section.toUpperCase()}</span>
            <span>Вопрос ${state.index+1} из ${state.questions.length}</span>
        </div>
        <div class="progress" style="margin-bottom:25px;background:#eee">
            <div class="progress-fill" style="width:${((state.index)/state.questions.length)*100}%"></div>
        </div>
        <div class="question">${q.q}</div>
        <div class="answers">
        ${q.a.map((answer,i)=>
            <button class="answer" onclick="checkAnswer(${i})" id="answer-${i}">${answer}</button>
        ).join("")}
        </div>
        <div id="explanation"></div>
        <button id="nextButton" class="next-btn hidden" onclick="nextQuestion()">Следующий вопрос</button>
    </div>;
}

function checkAnswer(index){
    if(quizState.answered) return;
    const q=quizState.questions[quizState.index];
    
    if(index===q.correct){
        quizState.answered=true;
        quizState.score++;
        document.getElementById("answer-"+index).classList.add("correct");
        document.getElementById("explanation.innerHTML = <div class="explanation" style="background:#e5f1e9; color:#2d573b; border-color:#a8c9b4;"><b>Правильно! ⭐</b><br>${q.explain}</div>;
        
        // Показываем блок с объяснением и активируем кнопку далее
        document.getElementById("explanation").innerHTML=
            <div class="explanation" style="background:#e5f1e9; color:#2d573b;"><b>Правильно! ⭐</b><br>${q.explain}</div>;
        document.getElementById("nextButton").classList.remove("hidden");
        if(quizState.index === quizState.questions.length - 1){
            document.getElementById("nextButton").textContent = "Завершить";
        }
    } else {
        // Ошибка: НЕ выдаем правильный ответ сразу, а даем объяснение и шанс ответить снова
        document.getElementById("answer-"+index).classList.add("wrong");
        registerMistake(quizState.section);
        document.getElementById("explanation").innerHTML=
            <div class="explanation">
                <b>💡 Ошибка! Почему этот ответ неверный:</b><br>
                Выбранный вариант содержит ошибку в правиле. ${q.explain}<br><br>
                <em>Внимательно подумайте и попробуйте выбрать другой вариант ответа!</em>
            </div>`;
    }
}

function nextQuestion(){
    if(quizState.index<quizState.questions.length-1){
        quizState.index++; quizState.answered=false; renderQuestion();
    }else{ finishLesson(); }
}

function registerMistake(section){
    const user=currentUser();
    if(user.mistakes[section] !== undefined) {
        user.mistakes[section]++;
    } else {
        user.mistakes.punctuation++;
    }
    updateUser(user);
}

function finishLesson(){
    const user=currentUser();
    const key=quizState.section+"-"+quizState.lesson;
    if(!user.completed.includes(key)){ user.completed.push(key); user.stars+=quizState.score*2; }
    updateUser(user);
    const percent=Math.round(quizState.score/quizState.questions.length*100);
    document.getElementById("content").innerHTML=
    <div class="quiz-card" style="text-align:center">
        <div style="font-size:50px;margin-bottom:15px">${percent>=80?"🏆":"🌱"}</div>
        <h2>Урок завершён!</h2>
        <p style="color:var(--muted);margin:10px 0 20px">Ты ответил правильно на <b>${quizState.score}</b> из <b>${quizState.questions.length}</b> вопросов.</p>
        <div style="font-size:25px;font-weight:800">${percent}%</div>
        <p style="margin-top:8px">Получено ⭐ ${quizState.score*2}</p>
        <button class="next-btn" onclick="renderCourses()">Вернуться к разделам</button>
    </div>;
}

const diagnosticQuestions=[
{q:"Выберите предложение с причастным оборотом.",a:["Ученик читает книгу.","Ученик, внимательно изучающий текст, сделал вывод.","Ученик сделал вывод.","Ученик быстро пишет."],correct:1,topic:"participle"},
{q:"Выберите предложение с деепричастным оборотом.",a:["Девочка читает.","Девочка читала книгу.","Читая книгу, девочка делала заметки.","Девочка записала ответ."],correct:2,topic:"gerund"},
{q:"Выберите СПП.",a:["Наступил вечер.","Мы вернулись домой, потому что начался дождь.","Наступил вечер и стало темно.","Дождь прекратился."],correct:1,topic:"spp"},
{q:"Выберите правильную пунктуацию.",a:["Читая книгу ученик делал заметки.","Читая книгу, ученик делал заметки.","Читая, книгу ученик делал заметки.","Читая книгу ученик, делал заметки."],correct:1,topic:"punctuation"},
{q:"Где правильно обособлен причастный оборот?",a:["Дом построенный недавно выглядит красиво.","Дом, построенный недавно, выглядит красиво.","Дом построенный недавно, выглядит красиво.","Дом, построенный недавно выглядит красиво."],correct:1,topic:"participle"},
{q:"В каком предложении нет грамматической ошибки?",a:["Подходя к школе, начался дождь.","Читая текст, ученик делал пометки.","Возвращаясь домой, мне позвонили.","Изучая тему, правило стало понятнее."],correct:1,topic:"gerund"},
{q:"Определите вид придаточного: «Я знаю, что ты придёшь».",a:["места","условия","изъяснительное","определительное"],correct:2,topic:"spp"},
{q:"Выберите правильный вариант.",a:["Когда закончился урок мы вышли.","Когда закончился урок, мы вышли.","Когда, закончился урок мы вышли.","Когда закончился, урок мы вышли."],correct:1,topic:"punctuation"}
];

let diagnosticState={ index:0, score:0 };

function renderDiagnostic(){ diagnosticState={ index:0, score:0 }; renderDiagnosticQuestion(); }

function renderDiagnosticQuestion(){
    const q=diagnosticQuestions[diagnosticState.index];
    document.getElementById("content").innerHTML=
    <div class="quiz-card">
        <div class="quiz-head"><span>ДИАГНОСТИКА</span><span>${diagnosticState.index+1}/${diagnosticQuestions.length}</span></div>
        <h2 style="margin-bottom:8px">Тест уровня знаний</h2>
        <p style="color:var(--muted);margin-bottom:22px">Этот тест поможет определить, какие темы требуют дополнительной практики.</p>
        <div class="question">${q.q}</div>
        <div class="answers">${q.a.map((a,i)=><button class="answer" onclick="diagnosticAnswer(${i})">${a}</button>).join("")}</div>
    </div>;
}

function diagnosticAnswer(index){
    const q=diagnosticQuestions[diagnosticState.index];
    if(index===q.correct) diagnosticState.score++;
    if(diagnosticState.index<diagnosticQuestions.length-1){ diagnosticState.index++; renderDiagnosticQuestion(); }else{ finishDiagnostic(); }
}

function finishDiagnostic(){
    const user=currentUser();
    const percent=Math.round(diagnosticState.score/diagnosticQuestions.length*100);
    user.before=percent; updateUser(user);
    document.getElementById("content").innerHTML=
    <div class="quiz-card" style="text-align:center">
        <div style="font-size:48px">📊</div>
        <h2>Диагностика завершена</h2>
        <p style="color:var(--muted);margin:10px">Твой результат до обучения:</p>
        <div style="font-size:45px;font-weight:800">${percent}%</div>
        <p style="margin:10px 0 20px">${getDiagnosticText(percent)}</p>
        <button class="next-btn" onclick="renderCourses()">Перейти к обучению</button>
    </div>;
}

function getDiagnosticText(p){
    if(p>=80) return "Отличная база! Можно переходить к сложным заданиям.";
    if(p>=50) return "Средний уровень. Некоторые темы требуют практики.";
    return "Начальный уровень. Рекомендуем пройти основные уроки.";
}

function renderAnalytics(){
    const user=currentUser();
    const mistakes=user.mistakes;
    const before=user.before===null?60:user.before;
    const after=user.after===null?Math.min(100,before+20):user.after;
    const topics=[["Причастия",mistakes.participle,"participle"],["Деепричастия",mistakes.gerund,"gerund"],["СПП",mistakes.spp,"spp"],["Пунктуация",mistakes.punctuation,"punctuation"],["Синтаксис",mistakes.syntax||0,"syntax"],["Стиль",mistakes.style||0,"style"]];
    document.getElementById("content").innerHTML=
    <div class="section-title"><h3>📊 Аналитика обучения</h3></div>
    <div class="stats">
        <div class="stat"><div class="stat-icon">📝</div><div class="stat-value">${before}%</div><div class="stat-name">Диагностика до обучения</div></div>
        <div class="stat"><div class="stat-icon">🎯</div><div class="stat-value">${after}%</div><div class="stat-name">Результат после обучения</div></div>
        <div class="stat"><div class="stat-icon">📈</div><div class="stat-value">+${Math.max(0,after-before)}%</div><div class="stat-name">Изменение результата</div></div>
        <div class="stat"><div class="stat-icon">❌</div><div class="stat-value">${Object.values(mistakes).reduce((a,b)=>a+b,0)}</div><div class="stat-name">Зафиксировано ошибок</div></div>
    </div>
    <div class="chart-card">
        <h3>Результат «До → После»</h3>
        <div class="chart-row"><div class="chart-label"><span>До обучения</span><b>${before}%</b></div><div class="bar"><div class="bar-fill before" style="width:${before}%"></div></div></div>
        <div class="chart-row"><div class="chart-label"><span>После обучения</span><b>${after}%</b></div><div class="bar"><div class="bar-fill after" style="width:${after}%"></div></div></div>
    </div>
    <div class="section-title"><h3>Ошибки по темам</h3></div>
    <div class="chart-card">
        ${topics.map(t=>{let value=Math.min(100,t[1]*10);return<div class="chart-row"><div class="chart-label"><span>${t[0]}</span><b>${t[1]} ошибок</b></div><div class="bar"><div class="bar-fill before" style="width:${value}%"></div></div></div>;}).join("")}
    </div>;
}

function renderProfile(){
    const user=currentUser();
    const totalLessons=sections.reduce((sum,s)=>sum+s.lessons.length,0);
    const percent=Math.round(user.completed.length/totalLessons*100);
    document.getElementById("content").innerHTML=
    <div class="section-title"><h3>♙ Мой профиль</h3></div>
    <div class="profile-card">
        <div class="big-avatar">${user.name.charAt(0).toUpperCase()}</div>
        <h2>${user.name}</h2>
        <p style="color:var(--muted);margin-top:4px">${user.email}</p>
        <div style="margin-top:25px">
            <b>Общий прогресс</b>
            <div class="progress" style="margin-top:8px;background:#eee"><div class="progress-fill" style="width:${percent}%"></div></div>
            <div style="font-size:12px;color:var(--muted);margin-top:5px">${percent}% завершено</div>
        </div>
        <div class="badges">
            <div class="badge">⭐ ${user.stars} звёзд</div>
            <div class="badge">🔥 ${user.streak} дней</div>
            <div class="badge">🏆 ${getLevel(user.stars)}</div>
        </div>
    </div>;
}

function toggleMobile(){ const sidebar=document.querySelector(".sidebar"); sidebar.style.display=sidebar.style.display==="block"?"none":"block"; }

window.addEventListener("load",()=>{
    if(localStorage.getItem(STORAGE_SESSION)){ openApp(); }else{ document.getElementById("authPage").style.display="flex"; }
});
</script>
